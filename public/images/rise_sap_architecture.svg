<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="100%" height="100%">
  <defs>
    <!-- Card & Drop Shadow -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#001B3A" flood-opacity="0.08" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Outer Ring Gradient (Hyperscalers - Deep Royal Navy) -->
    <linearGradient id="hyperscalerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#051D40" />
      <stop offset="50%" stop-color="#072B5E" />
      <stop offset="100%" stop-color="#051D40" />
    </linearGradient>

    <!-- Middle Ring Gradient (SAP Platform & Process Solutions) -->
    <linearGradient id="middleRingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005A9C" />
      <stop offset="50%" stop-color="#0070BA" />
      <stop offset="100%" stop-color="#005A9C" />
    </linearGradient>

    <!-- Core Ring Gradient (SAP S/4HANA Cloud Core) -->
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#041E42" />
      <stop offset="60%" stop-color="#004B87" />
      <stop offset="100%" stop-color="#0070BA" />
    </linearGradient>

    <linearGradient id="cyanAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3E0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Text Paths for curved labels -->
    <path id="pathHyperscalers" d="M 280 660 A 485 485 0 0 1 1120 660" fill="none" />
    <path id="pathBtp" d="M 376 660 A 324 324 0 0 1 540 376" fill="none" />
    <path id="pathSignavio" d="M 545 370 A 324 324 0 0 1 855 370" fill="none" />
    <path id="pathNetwork" d="M 860 376 A 324 324 0 0 1 1024 660" fill="none" />
    <path id="pathCore" d="M 537 660 A 163 163 0 0 1 863 660" fill="none" />
  </defs>

  <style>
    .title-text { font-family: 'Sora', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .label-bold { font-family: 'Sora', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .label-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Card Background with High-End Styling -->
  <rect x="15" y="15" width="1370" height="750" rx="28" fill="url(#bgGradient)" stroke="#CBD5E1" stroke-width="2" filter="url(#cardShadow)" />
  <rect x="25" y="25" width="1350" height="730" rx="20" fill="none" stroke="#F1F5F9" stroke-width="2" />

  <!-- Title Header -->
  <g id="header-group">
    <text x="700" y="72" text-anchor="middle" class="title-text" font-size="34" fill="#0A1E3F" letter-spacing="-0.5">
      RISE with SAP Architecture
    </text>
    <line x1="580" y1="88" x2="820" y2="88" stroke="#00A3E0" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- =========================================================================
       1. OUTER LAYER: HYPERSCALERS (AWS | AZURE | GCP | SAP DC)
       ========================================================================= -->
  <g id="outer-layer-hyperscalers">
    <!-- Sector 1: AWS (180deg to 135deg) -->
    <path d="M 1260.00 660.00 A 560 560 0 0 1 1095.98 264.02 L 989.91 370.09 A 410 410 0 0 0 1110.00 660.00 Z" fill="#061F42" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Sector 2: Microsoft Azure (135deg to 90deg) -->
    <path d="M 1095.98 264.02 A 560 560 0 0 1 700.00 100.00 L 700.00 250.00 A 410 410 0 0 0 989.91 370.09 Z" fill="#072B5E" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Sector 3: Google Cloud (90deg to 45deg) -->
    <path d="M 700.00 100.00 A 560 560 0 0 1 304.02 264.02 L 410.09 370.09 A 410 410 0 0 0 700.00 250.00 Z" fill="#072B5E" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Sector 4: SAP Private Cloud / DC (45deg to 0deg) -->
    <path d="M 304.02 264.02 A 560 560 0 0 1 140.00 660.00 L 290.00 660.00 A 410 410 0 0 0 410.09 370.09 Z" fill="#061F42" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Top Label Header: "Hyperscalers" Banner -->
    <path d="M 977.50 179.36 A 555 555 0 0 1 422.50 179.36 L 442.50 214.00 A 515 515 0 0 0 957.50 214.00 Z" fill="#00A3E0" opacity="0.25" />
    <path d="M 525 210 A 535 535 0 0 1 875 210" fill="none" stroke="#00A3E0" stroke-width="1.5" stroke-dasharray="4 4" />
    
    <text x="700" y="165" text-anchor="middle" class="label-bold" font-size="19" fill="#FFFFFF" letter-spacing="2">
      HYPERSCALERS
    </text>

    <!-- Sector 1 Content: AWS -->
    <g transform="translate(245, 435)">
      <!-- AWS Icon: Cube / Arrow -->
      <path d="M 0 -18 L 18 -8 L 18 12 L 0 22 L -18 12 L -18 -8 Z" fill="#FF9900" opacity="0.9" />
      <path d="M 0 -18 L 18 -8 L 0 2 L -18 -8 Z" fill="#FFB84D" />
      <path d="M 0 2 L 18 -8 L 18 12 L 0 22 Z" fill="#E68A00" />
      <!-- Text -->
      <text x="32" y="2" class="title-text" font-size="24" fill="#FFFFFF" font-weight="900" letter-spacing="-0.5">aws</text>
      <!-- AWS Smile arrow -->
      <path d="M 32 12 Q 52 22 72 12" fill="none" stroke="#FF9900" stroke-width="3" stroke-linecap="round" />
      <path d="M 70 8 L 75 12 L 69 15 Z" fill="#FF9900" />
      <text x="52" y="34" text-anchor="middle" class="label-mono" font-size="11" fill="#93C5FD">Cloud Region</text>
    </g>

    <!-- Sector 2 Content: Microsoft Azure -->
    <g transform="translate(485, 275)">
      <!-- Azure 4-square icon -->
      <rect x="-35" y="-18" width="13" height="13" rx="2" fill="#F25022" />
      <rect x="-18" y="-18" width="13" height="13" rx="2" fill="#7FBA00" />
      <rect x="-35" y="-1" width="13" height="13" rx="2" fill="#00A4EF" />
      <rect x="-18" y="-1" width="13" height="13" rx="2" fill="#FFB900" />
      <!-- Text -->
      <text x="6" y="-3" class="label-bold" font-size="19" fill="#FFFFFF">Microsoft</text>
      <text x="6" y="19" class="label-bold" font-size="22" fill="#38BDF8">Azure</text>
    </g>

    <!-- Sector 3 Content: Google Cloud -->
    <g transform="translate(865, 275)">
      <!-- Google Cloud Icon: 4-color cloud -->
      <path d="M -30 2 C -30 -8 -22 -16 -12 -16 C -6 -16 -1 -13 2 -9 C 6 -15 14 -17 21 -13 C 27 -9 30 -3 29 4 C 34 5 38 10 37 16 C 36 21 31 25 25 25 L -23 25 C -29 25 -34 20 -34 14 C -34 9 -32 4 -28 3" fill="none" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="-16" cy="6" r="6" fill="#EA4335" />
      <circle cx="-4" cy="-2" r="7" fill="#4285F4" />
      <circle cx="10" cy="0" r="7" fill="#FBBC05" />
      <circle cx="16" cy="11" r="6" fill="#34A853" />
      <!-- Text -->
      <text x="44" y="-3" class="label-bold" font-size="19" fill="#FFFFFF">Google</text>
      <text x="44" y="19" class="label-bold" font-size="21" fill="#60A5FA">Cloud</text>
    </g>

    <!-- Sector 4 Content: SAP Data Center -->
    <g transform="translate(1085, 435)">
      <!-- SAP Box Logo -->
      <rect x="-55" y="-15" width="45" height="26" rx="3" fill="#0070BA" stroke="#FFFFFF" stroke-width="1.5" />
      <text x="-33" y="4" text-anchor="middle" class="title-text" font-size="13" fill="#FFFFFF" font-weight="900">SAP</text>
      <!-- Text -->
      <text x="2" y="-1" class="label-bold" font-size="18" fill="#FFFFFF">Enterprise</text>
      <text x="2" y="19" class="label-bold" font-size="18" fill="#38BDF8">Data Center</text>
      <text x="2" y="35" class="label-mono" font-size="11" fill="#93C5FD">Dedicated SLA</text>
    </g>
  </g>

  <!-- =========================================================================
       2. MIDDLE LAYER: SAP BTP | SIGNAVIO | BUSINESS NETWORK
       ========================================================================= -->
  <g id="middle-layer-platform">
    <!-- Sector 1: SAP BTP (180deg to 125deg) -->
    <path d="M 1102.00 660.00 A 402 402 0 0 1 930.58 330.70 L 840.53 459.31 A 245 245 0 0 0 945.00 660.00 Z" fill="#005A9E" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Sector 2: SAP Signavio Process Solutions (125deg to 55deg) -->
    <path d="M 930.58 330.70 A 402 402 0 0 1 469.42 330.70 L 559.47 459.31 A 245 245 0 0 0 840.53 459.31 Z" fill="#0070BA" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Sector 3: SAP Business Network (55deg to 0deg) -->
    <path d="M 469.42 330.70 A 402 402 0 0 1 298.00 660.00 L 455.00 660.00 A 245 245 0 0 0 559.47 459.31 Z" fill="#005A9E" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Content: Left Sector (SAP BTP) -->
    <g transform="translate(370, 520) rotate(-28)">
      <rect x="-105" y="-28" width="210" height="56" rx="14" fill="#041E42" opacity="0.3" />
      <text x="0" y="-8" text-anchor="middle" class="label-bold" font-size="15" fill="#FFFFFF">SAP Business Technology</text>
      <text x="0" y="13" text-anchor="middle" class="label-bold" font-size="16" fill="#38BDF8">Platform (SAP BTP)</text>
    </g>

    <!-- Content: Center Sector (SAP Signavio) -->
    <g transform="translate(700, 335)">
      <!-- Process Mining Gear / Loop Icon -->
      <circle cx="0" cy="-30" r="14" fill="#00A3E0" opacity="0.3" />
      <path d="M -8 -30 A 8 8 0 1 1 8 -30 A 8 8 0 1 1 -8 -30" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="8 3" />
      <text x="0" y="-5" text-anchor="middle" class="label-bold" font-size="19" fill="#FFFFFF">SAP Signavio</text>
      <text x="0" y="19" text-anchor="middle" class="label-bold" font-size="16" fill="#BAE6FD">Process Intelligence</text>
    </g>

    <!-- Content: Right Sector (SAP Business Network) -->
    <g transform="translate(1030, 520) rotate(28)">
      <rect x="-100" y="-28" width="200" height="56" rx="14" fill="#041E42" opacity="0.3" />
      <text x="0" y="-8" text-anchor="middle" class="label-bold" font-size="15" fill="#FFFFFF">SAP Business</text>
      <text x="0" y="13" text-anchor="middle" class="label-bold" font-size="16" fill="#38BDF8">Network Collaboration</text>
    </g>
  </g>

  <!-- =========================================================================
       3. INNER CORE: SAP S/4HANA CLOUD (PRIVATE EDITION / DIGITAL CORE)
       ========================================================================= -->
  <g id="inner-core-layer">
    <!-- Inner Arch Shell -->
    <path d="M 937.00 660.00 A 237 237 0 0 1 463.00 660.00 L 610.00 660.00 A 90 90 0 0 0 790.00 660.00 Z" fill="url(#coreGrad)" stroke="#FFFFFF" stroke-width="3" />
    
    <!-- Luminous Cyan Outer Border Ribbon -->
    <path d="M 463 660 A 237 237 0 0 1 937 660" fill="none" stroke="#00A3E0" stroke-width="4" filter="url(#glowCyan)" />

    <!-- Center Arch Content -->
    <g transform="translate(700, 520)">
      <!-- Glowing S/4HANA Cloud Engine Shield -->
      <circle cx="0" cy="-60" r="22" fill="#00A3E0" opacity="0.2" />
      <path d="M 0 -76 L 16 -68 L 16 -52 L 0 -44 L -16 -52 L -16 -68 Z" fill="#00A3E0" />
      <path d="M 0 -72 L 12 -66 L 12 -54 L 0 -48 L -12 -54 L -12 -66 Z" fill="#041E42" />
      <text x="0" y="-56" text-anchor="middle" class="title-text" font-size="10" fill="#38BDF8" font-weight="900">S/4</text>

      <!-- Main Headline -->
      <text x="0" y="-18" text-anchor="middle" class="title-text" font-size="26" fill="#FFFFFF" letter-spacing="-0.5">
        SAP S/4HANA Cloud
      </text>

      <!-- Subtitle Badge -->
      <rect x="-85" y="-5" width="170" height="26" rx="13" fill="#00A3E0" opacity="0.9" />
      <text x="0" y="13" text-anchor="middle" class="label-bold" font-size="13" fill="#FFFFFF" letter-spacing="1">
        PRIVATE EDITION
      </text>

      <!-- Core Capabilities Pill -->
      <text x="0" y="38" text-anchor="middle" class="label-mono" font-size="11" fill="#7DD3FC" letter-spacing="0.5">
        In-Memory Digital Core • Clean Core ABAP
      </text>
    </g>

    <!-- Inner Hollow Arch Base Glow -->
    <path d="M 610 660 A 90 90 0 0 1 790 660" fill="none" stroke="#00A3E0" stroke-width="3" stroke-dasharray="4 4" />
  </g>

  <!-- =========================================================================
       4. FOUNDATION GROUND BAR
       ========================================================================= -->
  <g id="ground-bar">
    <rect x="100" y="654" width="1200" height="14" rx="7" fill="#041E42" />
    <rect x="100" y="654" width="1200" height="3" fill="#00A3E0" />
    
    <!-- Subtle Base Legend / Value Stream -->
    <text x="140" y="695" class="label-mono" font-size="11" fill="#64748B">FOUNDATION: MULTI-CLOUD HYPERSCALER INFRASTRUCTURE</text>
    <text x="700" y="695" text-anchor="middle" class="label-mono" font-size="11" fill="#0070BA" font-weight="700">BUSINESS TRANSFORMATION AS A SERVICE</text>
    <text x="1260" y="695" text-anchor="end" class="label-mono" font-size="11" fill="#64748B">SINGLE CONTRACT • 99.9% UPTIME SLA</text>
  </g>
</svg>